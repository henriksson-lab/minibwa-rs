[package]
name = "minibwa-rs"
version = "0.2.0"
edition = "2021"
description = "Rust translation of minibwa for BWT indexing and sequence alignment"
readme = "README.md"
license = "MIT"
repository = "https://github.com/henriksson-lab/minibwa-rs"
homepage = "https://github.com/henriksson-lab/minibwa-rs"
documentation = "https://docs.rs/minibwa-rs"
keywords = ["bioinformatics", "alignment", "bwt", "sequencing"]
categories = ["science", "command-line-utilities"]
autobins = false
autotests = false
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/src/*.rs",
    "/tests/**",
]

[features]
default = []
cli = []
# Feature for building the shipped binary: CLI plus the mimalloc allocator.
# Library users who only want the CLI surface enable `cli` (no mimalloc).
bin = ["cli", "mimalloc"]
mimalloc = ["dep:mimalloc"]
stage-time = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "minibwa-rs"
path = "src/main.rs"
required-features = ["bin"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
flate2 = "1"
libc = "0.2"
libm = "0.2"
libsais-rs = "0.2.2"
rayon = "1.10"

[target.'cfg(not(any(windows, target_arch = "wasm32")))'.dependencies]
mimalloc = { version = "0.1.50", default-features = false, optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
